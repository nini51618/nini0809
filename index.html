<!DOCTYPE html>

<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>聖經題庫答題系統 - 2026.5.11版</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }

        .fixed-panel { min-height: 400px; display: flex; flex-direction: column; justify-content: space-between; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    </style>

</head>

<body class="p-4 md:p-8">

    <div id="app" class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-6 overflow-hidden">

        <!-- 標題 -->

        <div class="text-center mb-6 border-b pb-4">

            <h1 class="text-2xl font-bold text-blue-800">聖經題庫答題系統 (2026.5.11版)</h1>

        </div>



        <!-- 步驟 1: 設定出題方式 (原步驟 2，已移除姓名輸入頁) -->

        <div id="step-config" class="space-y-6">

            <div>

                <span class="block font-bold mb-2">1. 選擇題型</span>

                <div class="flex gap-4">

                    <label class="flex-1 border p-3 rounded-lg cursor-pointer hover:bg-gray-50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500">

                        <input type="radio" name="quiz-type" value="short" checked class="hidden" onchange="updateMaxRange()"> 簡答題 (共 321 題)

                    </label>

                    <label class="flex-1 border p-3 rounded-lg cursor-pointer hover:bg-gray-50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500">

                        <input type="radio" name="quiz-type" value="choice" class="hidden" onchange="updateMaxRange()"> 選擇題 (共 275 題)

                    </label>

                </div>

            </div>



            <div>

                <span class="block font-bold mb-2">2. 出題方式</span>

                <div class="flex gap-4 mb-4">

                    <label class="flex-1 flex items-center gap-2">

                        <input type="radio" name="mode" value="range" checked onchange="toggleMode()"> 指定範圍

                    </label>

                    <label class="flex-1 flex items-center gap-2">

                        <input type="radio" name="mode" value="random" onchange="toggleMode()"> 隨機抽題

                    </label>

                </div>

                

                <div class="grid grid-cols-2 gap-4 p-4 bg-gray-50 rounded-lg">

                    <div>

                        <label class="text-sm text-gray-500">起始題號</label>

                        <input type="number" id="range-start" value="1" min="1" class="w-full p-2 border rounded">

                    </div>

                    <div>

                        <label class="text-sm text-gray-500">結束題號</label>

                        <input type="number" id="range-end" value="10" min="1" class="w-full p-2 border rounded">

                    </div>

                    <div id="random-count-box" class="hidden col-span-2">

                        <label class="text-sm text-gray-500">抽題數量</label>

                        <input type="number" id="random-count" value="5" min="1" class="w-full p-2 border rounded">

                    </div>

                </div>

            </div>



            <button onclick="startQuiz()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">開始作答</button>

        </div>



        <!-- 步驟 2: 作答頁面 -->

        <div id="step-quiz" class="hidden fixed-panel">

            <div class="mb-4">

                <div class="flex justify-between items-center text-sm text-gray-500 mb-2">

                    <span id="quiz-progress">題目 1 / 10</span>

                    <span id="quiz-id-tag" class="bg-gray-200 px-2 rounded">題號 #1</span>

                </div>

                <div id="question-text" class="text-xl font-semibold text-gray-800 leading-relaxed min-h-[100px]">

                    題目讀取中...

                </div>

            </div>



            <!-- 簡答題介面 -->

            <div id="ui-short" class="space-y-4">

                <div id="short-answer-box" class="hidden p-4 bg-yellow-50 border-l-4 border-yellow-400 text-lg font-medium mb-4">

                    答案：<span id="correct-answer-text"></span>

                </div>

                <button id="btn-show-answer" onclick="showShortAnswer()" class="w-full bg-gray-800 text-white py-3 rounded-lg">顯示答案</button>

                <div id="short-judge-group" class="hidden btn-group">

                    <button onclick="judgeShort(true)" class="bg-green-600 text-white py-4 rounded-lg font-bold">正確 (←)</button>

                    <button onclick="judgeShort(false)" class="bg-red-600 text-white py-4 rounded-lg font-bold">錯誤 (→)</button>

                </div>

            </div>



            <!-- 選擇題介面 -->

            <div id="ui-choice" class="hidden grid grid-cols-1 gap-3">

                <!-- 選項會動態產生 -->

            </div>



            <div class="mt-6 pt-4 border-t flex justify-between gap-4">

                <button onclick="restartApp()" class="px-6 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg transition">重新作答</button>

                <button id="btn-next" onclick="nextQuestion()" class="hidden flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold">下一題</button>

            </div>

        </div>



        <!-- 步驟 3: 結算頁面 -->

        <div id="step-result" class="hidden space-y-6">

            <div class="text-center">

                <h2 class="text-3xl font-bold text-blue-700">測驗結束！</h2>

                <p id="score-summary" class="text-lg mt-2 font-medium"></p>

            </div>



            <div class="border-t pt-4">

                <h3 class="font-bold text-red-600 mb-3 underline">錯誤題目清單：</h3>

                <div id="wrong-list" class="space-y-4 max-h-[400px] overflow-y-auto pr-2">

                    <!-- 錯誤清單內容 -->

                </div>

            </div>



            <button onclick="restartApp()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold text-xl">回主畫面</button>

        </div>

    </div>

            { id: 93, q: "在納鴻先知書中提到哪一種水果人一搖動,就落在食者的口裡?", a: "無花果" },

            { id: 95, q: "哪一篇書信是為“一位婦女被揀選”而寫的?", a: "若望二書" },

            { id: 96, q: "法利賽人向耶穌說:“你看!他們為什麼做安息日不許做的事?”他們是做了什麼事?", a: "掐食起麥穗" },

            { id: 97, q: "看到天使來報主耶穌聖嬰誕生的消息,牧羊人有什麼反應?", a: "害怕" },

            { id: 98, q: "聖若翰洗者自認為自己像是:", a: "一位新郎的朋友" },

            { id: 99, q: "他們把主耶穌釘在十字架上幾個時辰?", a: "六個時辰" },

            { id: 100, q: "神父會在彌撒中穿紅色的祭衣的節日有哪些?", a: "聖枝主日、聖週五耶穌受難日、聖神降臨主日、殉道聖人節日。" },

            { id: 101, q: "何謂梅瑟五書?", a: "創世紀、出谷紀、肋未紀、戶籍紀、申命紀。" },

            { id: 102, q: "在瑪竇福音中耶穌用了經上哪三句話退魔?", a: "人生活不只靠餅,而也靠天主口中所發的一切言語。\n你不可試探上主,你的天主!\n你要朝拜上主,你的天主,唯獨事奉他。" },

            { id: 103, q: "有一位法學士試探耶穌問說:師傅法律中那條誡命是最大的?耶穌回答後並稱全部法律和先知都繫於這兩條誡命。是哪兩條誡命?", a: "第一條你應全心、全靈、全意,愛上主你的天主。\n第二條你應當愛近人,如你自己。" },

            { id: 104, q: "耶穌告訴門徒,為了人子的緣故,你們會被帶到哪裡去?", a: "總督和君王前" },

            { id: 105, q: "耶穌告訴門徒,為了人子的緣故,你們會被帶到哪裡去?", a: "總督和君王前" },

            { id: 106, q: "真福八端?", a: "神貧的人是有福的,因為天國事他們的。\n哀慟的人是有福的,因為他們要受安慰。\n溫良的人是有福的,因為他們要承受土地。\n飢渴慕義的人是有福的,因為他要得飽飫。\n憐憫人的人是有福,因為它們要受憐憫。\n心裏潔淨的人是有福的,因為他們要看見天主。\n締造和平的人是有福的,因為他們要稱為天主的子女。\n為義而受迫害的人是有福的,因為天國是他們的。" },

            { id: 107, q: "耶穌告訴門徒,為了人子的緣故,你們會被帶到哪裡去?", a: "總督和君王前" },

            { id: 108, q: "在馬爾谷中耶穌提到要治癒治好附魔的兒童非要用甚麼方法?", a: "祈禱和禁食。" },

            { id: 109, q: "因受保祿講道而信奉了基督,同時在保祿被囚、坐監及殉道時,都隨侍在側,本人也是為主殉道的聖人是哪一位?", a: "路加" },

            { id: 110, q: "路加福音的題名是獻給哪一位有名望的希臘人,他在書內力證天主子耶穌基督是全人類的救主", a: "德敖斐羅" },

            { id: 111, q: "路加福音記載有關耶穌的童年史,應該是直接或間接出自誰的口授?", a: "聖母" },

            { id: 112, q: "天使顯現給匝加利亞並應允他的妻子依撒伯爾會有一個兒子,要起名為?", a: "若翰" },

            { id: 113, q: "匝加利亞從聖所出來時,成為?", a: "啞巴" },

            { id: 114, q: "聖母瑪利亞與依撒伯爾的關係是?", a: "親戚" },

            { id: 115, q: "耶穌受洗時,聖神藉著什麼形象降在他上邊,並有聲音從天上說:你是我的愛子,我因你而喜悅。", a: "鴿子" },

            { id: 116, q: "耶穌被聖神引到荒野,受魔鬼試探幾天?", a: "40天" },

            { id: 117, q: "耶穌禁食三退魔誘,一是命石頭變成餅,二是一切榮華與權勢,三是從聖殿頂上跳下去,耶穌的回答是什麼?", a: "不可試探上主,你的天主" },

            { id: 118, q: "耶穌對誰說:“不要害怕,從今以後你要做捕人的漁夫”", a: "西滿伯多祿(耶穌邀請西滿伯多祿,成為耶穌的門徒,並立他為教會的元首)" },

            { id: 119, q: "耶穌對法利賽人和他們的經師說:“不是健康的人需要醫生,而是有病的人,我不是來召叫義人,而是召叫什麼樣的人”?", a: "罪人悔改" },

            { id: 120, q: "上主曾這樣說:「你們要看見我的僕人有得吃,你們卻要飢餓;你們看見我的僕人有得喝,你們卻要口渴;你們看見我的僕人喜樂,你們卻要哭泣。」這段話主要在說什麼?", a: "善惡命運決不同" },

            { id: 121, q: "在依撒意亞先知書中提到,「在我的整個聖山上,再沒有誰作惡,也沒有誰害人」,這境界是如何做到的?", a: "因為大地充滿了對上主的認識,有如海洋滿溢海水。" },

            { id: 122, q: "在依撒意亞先知書中特別提到哪三個地方蒙受祝福?", a: "埃及、亞述、以色列" },

            { id: 123, q: "在依撒意亞先知書第7:14-16章,宣佈了什麼神諭?意即指向未來的默西亞。", a: "厄瑪奴耳" },

            { id: 124, q: "在依撒意亞先知書中提到,誰是我們的判官、立法者,以及必拯救我們的君王?", a: "上主" },

            { id: 125, q: "依撒意亞先知曾多次遭到誰的辱罵與恐嚇?", a: "亞述王" },

            { id: 126, q: "在依撒意亞先知書中提到,希則克雅害病將死,卻因誠心懇求天主,再延了多久的壽命?", a: "15年" },

            { id: 127, q: "是什麼使我們與我們的天主隔絕?", a: "罪惡" },

            { id: 128, q: "當你看見兄弟眼中的木屑,而竟看不見自己眼中的……,豈不是假善人", a: "大樑" },

            { id: 129, q: "凡到我跟前,聽了我的道理而實行的,他相似一個建築房屋的人,掘地深挖,把基礎建立在……上,洪水爆發時也不能動搖它,因為建築的好。", a: "磐石" },

            { id: 130, q: "耶穌撒種的比喻,種子落在路旁,落在石頭上,落在荊棘中都無法生長,只有落在……,才可以長起來,結了百倍的果實", a: "好地裡" },

            { id: 131, q: "耶穌說的撒種的比喻,種子是比喻……的話", a: "天主" },

            { id: 132, q: "耶穌帶著伯多祿、若望、和雅各伯上山祈禱,面容改變,衣服潔白發光,忽然有二個人出現,談論耶穌的去世,那二個人是誰?", a: "梅瑟和厄里亞" },

            { id: 133, q: "馬爾谷寫福音的目的是什麼?", a: "要證明基督的天主性" },

            { id: 134, q: "耶穌曾對七十二個門徒說:你們不要因為魔鬼屈服你們這事而喜歡,你們應當喜歡的乃是因為你們的名字已經登記在……了", a: "天上" },

            { id: 135, q: "有一個法學士起來,試探耶穌說:「師傅,我應當做什麼,纔能獲得永生?」耶穌對他說:「法律上記載了什麼?你是怎樣讀的?」他答什麼?", a: "你應當全心、全靈、全力、全意愛上主,你的天主;並愛近人如你自己。" },

            { id: 136, q: "耶穌比喻你的……就是身體的燈,……純潔,全身就光明,如果邪惡全身就黑暗,為此你要小心,不要叫你內裡的光成了……", a: "眼睛,眼睛,黑暗" },

            { id: 137, q: "耶穌說天主的國相似……,人取來,種在自己的園中,它生長起來,成了大樹,天上的飛鳥都棲息在它的枝頭上", a: "一粒芥子" },

            { id: 138, q: "耶穌誕生後,天使曾指示聖家要逃往哪裡去?", a: "埃及" },

            { id: 139, q: "耶穌在哪裡治好了百夫長的僕人?", a: "葛法翁" },

            { id: 140, q: "耶穌派十二門徒出去宣講說……臨近了?", a: "天國" },

            { id: 141, q: "耶穌在哪裡治好了枯手的人?", a: "會堂" },

            { id: 142, q: "在撒種的比喻中會結果實的種子落在哪裡?", a: "好地裡" },

            { id: 143, q: "耶穌說:天國好像是藏在哪裡的寶貝?", a: "地裏" },

            { id: 144, q: "復活後的耶穌,要他的兄弟(門徒)到哪裡去見他?", a: "加里肋亞" },

            { id: 145, q: "耶穌在哪裡講道,人們抬了一個癱子來求祂醫治?", a: "葛法翁" },

            { id: 146, q: "耶穌召叫肋未時,肋未坐在什麼地方?", a: "稅關上" },

            { id: 147, q: "耶穌在哪裡治好了提買的兒子,他是一個瞎眼的乞丐?", a: "耶里哥" },

            { id: 148, q: "匝加利亞擔任司祭時,抽中了籤可以進到哪裡獻香?", a: "上主的聖所" },

            { id: 149, q: "若翰在哪裡宣講悔改的洗禮?", a: "約旦河一帶" },

            { id: 150, q: "耶穌受洗後,由約旦河回來,聖神帶領他到哪裡?", a: "荒野" },

            { id: 151, q: "匝凱為了要看耶穌爬上了哪裡?", a: "野桑樹上" },

            { id: 152, q: "若翰的父親是一位司祭名叫?母親是?他們在天主前是義人。", a: "匝加利亞,依撒伯爾" },

            { id: 153, q: "耶穌誕生在什麼地方?", a: "猶大的白冷" },

            { id: 154, q: "耶穌聽到若翰被監禁以後,就退避到哪裡去了?", a: "加里肋亞" },

            { id: 155, q: "耶穌說:凡怎樣的人,你們都到我跟前來,我要使你們安息。", a: "勞苦和負重擔" },

            { id: 156, q: "耶穌被捉前去哪個莊園祈禱?", a: "革責瑪尼" },

            { id: 157, q: "耶穌說過先知不宜死在哪裡以外?", a: "耶路撒冷" },

            { id: 158, q: "耶穌在哪裡行第一個奇蹟?", a: "加里肋亞加納的婚宴上" },

            { id: 159, q: "耶穌首次預言自己的受難,伯多祿在旁勸阻,耶穌對他說了什麼?", a: "撒殫,退到我後面去!因為你所體會的,不是天主的事,而是人的事。" },

            { id: 160, q: "耶穌囑咐祂的的門徒要提防法利賽人的什麼?", a: "酵母" },

            { id: 161, q: "洗者若翰宣講的洗禮是什麼的洗禮?", a: "悔改的洗禮" },

            { id: 162, q: "在亡羊的比喻中,那沒有走失的九十九隻羊被放在哪裡?", a: "荒野" },

            { id: 163, q: "伯多祿第三次否認耶穌後,雞就叫了,他的反應是什麼?", a: "放聲大哭起來" },

            { id: 164, q: "誰是第一個犯殺人罪的人?原因?", a: "加音,忌妒。" },

            { id: 165, q: "若翰與耶穌的洗禮有何不同?", a: "若翰的洗禮是使人懺悔的洗禮;耶穌的洗禮是赦罪的洗禮。" },

            { id: 166, q: "聖經有幾個部份?", a: "舊約和新約" },

            { id: 167, q: "公主請誰來照顧梅瑟?", a: "梅瑟的母親" },

            { id: 168, q: "在申命紀裡,上主你的天主,要由你中間,由你兄弟中,為你興起一位像我一樣的先知,你們應……", a: "應聽信他" },

            { id: 169, q: "天主把梅瑟埋葬在那裡?", a: "上主將他葬在摩阿布地,面對貝特培敖爾的一個山谷內。" },

            { id: 170, q: "他們向梅瑟報告說:「我們到了你派遣我們去的那個地方,實在是流…流…的地方;這是那地方的出產。", a: "流奶流蜜" },

            { id: 171, q: "跟著梅瑟去客納罕的那些群人,找到哪種水果?", a: "葡萄、石榴、無花果" },

            { id: 172, q: "按照聖保祿的勸勉,弟茂德應該以後不要單喝清水,卻要用點酒,為什麼?", a: "因為弟茂德患胃病" },

            { id: 173, q: "瑪竇福音中耶穌受洗時,有聲音由天上說:這是我的愛子,…請接下句", a: "我所喜悅的" },

            { id: 174, q: "根據瑪竇福音中耶穌的祖譜,共有幾位女子依序說出?", a: "塔瑪爾、辣哈布、盧德、烏黎雅的妻子、瑪利亞。" },

            { id: 175, q: "瑪竇福音的作者主要是寫給誰?", a: "歸化的猶太人" },

            { id: 176, q: "瑪竇福音中提到為應驗上主藉先知所說的話「我從埃及召回了我的兒子」是出自舊約哪位先知書曾提到的?", a: "歐瑟亞第11章1節" },

            { id: 177, q: "瑪竇福音中耶穌首批招叫的門徒有哪些?", a: "伯多祿、安德肋、雅各伯、若望。" },

            { id: 178, q: "瑪竇福音中提到基督徒與世界的關係為何?", a: "基督徒是地上的鹽、世界的光。" },

            { id: 179, q: "耶穌曾說過:「除非你們的義德,超過誰的義德,你們決進不了天國。", a: "經師和法利賽人。" },

            { id: 180, q: "耶穌對跟隨的人說:「在以色列我從未遇見過一個人,有這樣大的信心。」是在稱讚誰的信德?", a: "百夫長" },

            { id: 181, q: "達尼爾對宦官長派來的人說,你們可以試吃什麼?", a: "吃蔬菜、喝清水。" },

            { id: 182, q: "耶穌受洗時,有聲音從天上說什麼?", a: "你是我的愛子,我因你而喜悅。" },

            { id: 183, q: "耶穌在厄里亞和梅瑟的交談中,哪幾位是見證人?", a: "伯多祿、雅各伯和若望。" },

            { id: 184, q: "耶穌在山上祈禱改變容貌時,還同時出現哪兩位古聖人?", a: "梅瑟、厄里亞。" },

            { id: 185, q: "耶穌談得救之門時,勸我們竭力從何而入呢?", a: "窄門" },

            { id: 186, q: "耶穌誕生後,天使曾指示聖家要逃往哪裡去?", a: "埃及" },

            { id: 187, q: "厄則克耳吞下卷書嘴裏發生什麼變化?", a: "甘甜如蜜" },

            { id: 188, q: "厄則克耳先知書裡哪一句話出現多次?", a: "他們要承認我是上主" },

            { id: 189, q: "主說:我必賜給他們另一顆心,在他們臟腑放上另一種精神;拿走他們鐵石的心,給他們換上一顆怎樣的心?", a: "血肉的心" },

            { id: 190, q: "耶穌帶著伯多祿、雅各伯、若望上高山顯聖容後,耶穌囑咐他們,非等甚麼時候,不要將他們所見的告訴任何人?", a: "人子從死者中復活後" },

            { id: 191, q: "吾主上主使枯骨復生的寓意是什麼?", a: "天主的救恩,復興以色列,重生復活" },

            { id: 192, q: "為什麼達尼爾蒙天主保守呢?", a: "達尼爾忠信可靠、恒心恭敬天主、在天主面前是無罪的、信賴天主。" },

            { id: 193, q: "拿步高王為何將三青年投入火窯中燒死?", a: "不恭敬他們的神,也不朝拜他們所立的金像。" },

            { id: 194, q: "拿步高王把他們三個人全捆起來,拋入烈火窯中,卻看見有四個人無拘無束地在火中行走,絲毫沒有受傷,而且那第四個人的外貌,彷彿是誰?", a: "神的兒子" },

            { id: 195, q: "達尼爾遭受嫉妒被害投入獅子圈內,天主如何拯救他?", a: "天主打發他的天使閉住獅子的口" },

            { id: 196, q: "約納先知三日三夜在大魚肚腹中,預表什麼?", a: "耶穌也要三日後從死者中復活" },

            { id: 197, q: "哪一位先知他一直向天主發問,不肯放鬆?", a: "哈巴谷" },

            { id: 198, q: "米該亞先知所提出宗教生活的標準是什麼?", a: "履行正義、愛好慈善、虛心與你的天主來往。" },

            { id: 199, q: "哪一本先知書是色列民族歸國後的第一卷先知書?", a: "哈蓋" },

            { id: 200, q: "教宗良十三稱聖經為何?", a: "神學的靈魂" },

            { id: 201, q: "上主叫約納往哪個大城去,向他們宣佈:他們的邪惡已達到天主前並要毀滅了。", a: "尼尼微城" },

            { id: 202, q: "哪一位是眾小先知中最早的一位?", a: "亞毛斯" },

            { id: 203, q: "瑪拉基亞的名字,照原文有「我的使者」的意思。他的使命便是準備百姓,等待誰的來臨?", a: "默西亞" },

            { id: 204, q: "始終以上主的慈愛為其宣講的題材,也是新約道理的前導,是哪一部先知書?", a: "歐瑟亞" },

            { id: 205, q: "天主應許賜福亞巴郎,使他成為大國,須要有什麼條件?", a: "離開你的故鄉、你的家族和父家,往我指給你的地方去。" },

            { id: 206, q: "誰是雅各伯的長子,是雅各伯的力量,壯年的首生,但過於暴躁、激烈,沸騰有如滾水?", a: "勒烏本" },

            { id: 207, q: "厄東人不願借道以色列人,以色列人乃繞道前行,人民抱怨天主和梅瑟帶他們出埃及,天主用火蛇懲罰人民,因梅瑟的轉求,天主命梅瑟做甚麼,使人瞻仰得以保存生命?", a: "銅蛇" },

            { id: 208, q: "出埃及第三年,在親曠野卡德士,人民因為沒有水喝而動亂,天主教誰拿棍杖命令磐石出水,誰用棍杖打擊兩次才出水?", a: "梅瑟" },

            { id: 209, q: "科辣黑事件後,以色列會眾又抱怨梅瑟,再起騷動,天主憤怒發出災禍,誰為會眾舉行贖罪記,災禍才止息?", a: "亞郎" },

            { id: 210, q: "以色列子民啟程或停留紮營是根據甚麼?", a: "雲柱的上升及移動" },

            { id: 211, q: "依撒意亞曾向達味家族說,上主要給他們一個徵兆,有位貞女要懷孕生子,給他起名叫什麼?", a: "厄瑪奴耳。" },

            { id: 212, q: "成群結隊的駱駝,以及米德楊和厄法的獨峰駝要遮蔽你,牠們都是由舍巴滿載甚麼?禮物而來,宣揚上主的榮耀。", a: "黃金和乳香" },

            { id: 213, q: "將來每逢月朔,每逢什麼日子?凡屬血肉的,都要來我面前跪拜。", a: "安息日" },

            { id: 214, q: "上主告誡以民,在收割莊稼時,怎樣的做法是表示對窮苦人的慈悲心?除收割作物不可割到地邊外,還有呢?", a: "收割後剩下的穗子,不可再拾取。" },

            { id: 215, q: "紀念天主與以民在西乃山締結盟約的節日,稱為……", a: "五旬節" },

            { id: 216, q: "何人制定了長子名分不可移轉的規定?", a: "梅瑟" },

            { id: 217, q: "以民在曷勒布時做了什事,激怒了天主?", a: "鑄造牛犢,背叛天主。" },

            { id: 218, q: "梅瑟規定以民:每年在田地內播種所得的出產,應繳納多少做為獻儀呢?", a: "十分之一" },

            { id: 219, q: "耶穌以自己的聖血和聖死為全人類所立的永遠盟約,稱為?", a: "新約" },

            { id: 220, q: "新舊約全書通常分為三大類,除歷史書外,還有?", a: "先知書和智慧書" },

            { id: 221, q: "梅瑟五書為舊約中最重要的一部分,為梅瑟給以色列人所宣布的法律;而至新約的教會,其仍未失重要性,係因本書有何特性呢?", a: "因本書含有永生天主的啟示,及教會信仰的基礎。" },

            { id: 222, q: "教宗方濟各是第幾任教宗呢?現任的教宗良14是第幾任教宗呢?", a: "266、267任" },

            { id: 223, q: "四部福音中哪幾部的作者是耶穌門徒?", a: "瑪竇、若望。" },

            { id: 224, q: "聖保祿宗徒於公元58年初在哪裡寫了羅馬人書?", a: "格林多" },

            { id: 225, q: "聖保祿宗徒為何那麼渴望去羅馬見那些基督徒?", a: "堅固他們的信德" },

            { id: 226, q: "亞當和基督即是兩個不同時代的首領。亞當是舊時代,即死亡時代的首領;基督是新時代,即什麼時代的首領?", a: "生命時代的首領" },

            { id: 227, q: "四部福音中哪一部,引述了最多的舊約經文與典故?原因為何?", a: "瑪竇福音,因為瑪竇為了使猶太人相信耶穌是默西亞。" },

            { id: 228, q: "「己所欲者,先行於人」在瑪竇福音中有哪一句相近的話語嗎?", a: "凡你們願意人給你們做的,你們也要照樣給人做。" },

            { id: 229, q: "不是每一個向耶穌說「主啊!主啊!」的人都可以進入天國,那麼究竟誰可以進入天國?", a: "承行天主父旨意的人" },

            { id: 230, q: "瑪竇福音的最後一句話是什麼?", a: "看!我同你們天天在一起,直到今世的終結。" },

            { id: 231, q: "耶穌是被埋葬在誰的墓穴裡?", a: "阿黎瑪特雅人若瑟" },

            { id: 232, q: "按著瑪竇福音,耶穌在十字架上說的最後一句話是什麼?", a: "我的天主,我的天主,你為什麼捨棄了我?" },

            { id: 233, q: "在瑪竇福音中,耶穌死了以後,誰是第一個承認祂是天主子的人?", a: "百夫長" },

            { id: 234, q: "在耶穌十字架的板子上寫了什麼?", a: "這是耶穌,猶太人的君王。" },

            { id: 235, q: "在最後的晚餐中,耶穌建立了什麼聖事?", a: "聖秩聖事與聖體聖事" },

            { id: 236, q: "耶穌說最大的誡命是什麼?", a: "你應全心,全靈,全意,愛上主你的天主。" },

            { id: 237, q: "耶穌要我們寬恕別人多少次?", a: "70個7次" },

            { id: 238, q: "耶穌受難前所說的最後一句警語是什麼?", a: "你們要醒寤" },

            { id: 239, q: "一切誡命中那兩條最大?", a: "(一)、你應當全心、全靈、全意、全力愛上主,你的天主。\n(二)、你應當愛近人如你自己。" },

            { id: 240, q: "馬爾谷福音中記載目睹耶穌被釘死在十字架上的婦女有那些人?", a: "瑪利亞瑪達肋納,次雅各伯和若瑟的母親瑪利亞及撒羅默。" },

            { id: 241, q: "馬爾谷福音,開宗明義,要宣講天主的福音,主要是什麼?", a: "「時期已滿,天主的國臨近了,你們悔改,信從福音罷!」" },

            { id: 242, q: "耶穌問:“誰是我的母親和我的兄弟?“他自己是怎麼說的?", a: "誰奉行天主的旨意,他就是我的兄弟、姊妹和母親。" },

            { id: 243, q: "穌說:世人的一切罪惡,連所說的任何褻瀆的話,都可得赦免;但若褻瀆了誰?永遠不得赦免,而是永久罪惡的犯人。", a: "聖神" },

            { id: 244, q: "耶穌說:沒有人點燈是放在窖中或斗下的,而是放在燈台上,讓進來的人看見光明。耶穌也提到身體的燈,是指人的那個部位?", a: "眼睛" },

            { id: 245, q: "耶穌被釘在十字架上時,羅馬兵士在他上頭的牌子寫著:這是猶太人的君王,是用了哪三種語言寫的?", a: "希臘文、拉丁文、希伯來文。" },

            { id: 246, q: "耶穌為群眾講論天國的奧秘時,用了撒種的比喻,請問他說「撒出去的種子落在哪些地方」?", a: "路旁、石頭、荊棘、好地。" },

            { id: 247, q: "耶穌在路加福音中,開口說的第一句話是什麼?", a: "你們為什麼找我?你們不知道我必須在我父親那裡嗎?" },

            { id: 248, q: "耶穌被釘十字架,斷氣前的最後一句話是什麼?", a: "「父啊!我把我的靈魂交托在你手中」" },

            { id: 249, q: "耶穌說:「沒有一個家僕能事奉兩個主人的」,這兩個主人是指誰?", a: "天主和錢財" },

            { id: 250, q: "耶穌在貝特賽達顯奇蹟,用什麼使五千人吃飽?", a: "五個餅和兩條魚" },

            { id: 251, q: "耶穌被接升天去的日期就快要來到,所以他遂決意面朝那個地方走去,那地方指的是那裏?", a: "耶路撒冷" },

            { id: 252, q: "按路加福音記載耶穌曾治好一位患血漏病的婦人,請問那婦人患血漏病幾年了?", a: "12年" },

            { id: 253, q: "洗者若輸給人受洗後,提到應結與悔改相稱的果實,後來有人詢問他該如何作,除了有群眾、稅吏之外,還有那種身分的人問他?", a: "軍人" },

            { id: 254, q: "耶穌打發門徒去預備逾越節晚餐的地方,祂提到門徒進城會與一位拿著什麼的人相遇?", a: "水罐" },

            { id: 255, q: "耶穌吃完最後晚餐後在往橄欖山的路上,離開門徒往山園去祈禱。請問當時他離開門徒有多遠的距離?", a: "投石之遠" },

            { id: 256, q: "路加福音中有提到一位女先知,請問她叫什麼名字?", a: "亞納" },

            { id: 257, q: "彌撒中光榮頌會唱到「天主在天受光榮,主愛的人在世享平安」,其中「主愛的人在世享平安」這句話在路加福音的那個章節可以看到?", a: "路2:14" },

            { id: 258, q: "洗者若翰不喝甚麼?", a: "酒,淡酒濃酒他都不喝。" },

            { id: 259, q: "有關耶穌在曠野受魔鬼試探的記載,共提到多少段舊約上的話?", a: "4段" },

            { id: 260, q: "法利賽人的酵母是指甚麼?", a: "法利賽人的虛偽" },

            { id: 261, q: "耶穌吩咐誰進城去為他和門徒預備逾越節晚餐?", a: "伯多祿和若望" },

            { id: 262, q: "路加福音記載,耶穌要為王統治誰的家?直到永遠,他的王權沒有終結。", a: "雅各伯" },

            { id: 263, q: "蕩子回頭的比喻中,那蕩子在散盡家財後靠甚麼工作維生?", a: "放豬" },

            { id: 264, q: "《路加福音》是一部喜樂的福音:強調救贖的喜樂。一開始是若翰誕生的喜樂,請問最後是誰的喜樂?", a: "門徒們" },

            { id: 265, q: "根據路加福音,誰最先看到復活的耶穌?", a: "往厄瑪烏去的兩位門徒" },

            { id: 266, q: "耶穌在解釋誰是我們的近人時,說有一個人要到耶里哥去,途中遇著強盜,後來有那三個人先後路過他那裏?", a: "司祭、肋未人、撒瑪黎雅人。" },

            { id: 267, q: "經師和法利賽人何時開始商討如何陷害除掉耶穌?", a: "耶穌在安息日治好枯手人之後" },

            { id: 268, q: "耶穌在哪裡召叫門徒做「捕人的漁夫」?", a: "革乃撒勒湖湖邊" },

            { id: 269, q: "除了十二宗徒之外,耶穌還跟福音上提到名字的誰吃過飯?", a: "法利賽人西滿(肋未就是瑪竇,因此不算12宗徒以外)" },

            { id: 270, q: "耶穌治病(不含驅魔)的案例中,有哪些案例發生在安息日(以有較詳細描述的為準)?", a: "治好伯多祿岳母的熱症、治好傴僂病婦、治好患水臌症的人。" },

            { id: 271, q: "耶穌曾經因為哪些城市拒絕福音而譴責它們?", a: "苛辣匝因、貝特賽達和葛法翁。" },

            { id: 272, q: "耶穌只給試探祂的人一個甚麼徵兆?這個徵兆又指甚麼?", a: "約納的徵兆;指耶穌將在死後第三天復活。" },

            { id: 273, q: "請舉出路加福音中,耶穌一段有關「以德報怨」的訓導。", a: "「應愛你們的仇人,善待惱恨你們的人;應祝福詛咒你們的人,為毀謗你們的人祈禱。」" },

            { id: 274, q: "依據路加福音,耶穌兩次使死人復活,請分別說出來!", a: "第一次在納因城復活寡婦的獨子,第二次是復活會堂長雅依洛的女兒。" },

            { id: 275, q: "路23:6黑落德見了耶穌,不勝欣喜,原來他早就願意看看耶穌。請問按路加福音記載,早在那個章節黑落德就曾有此想法?", a: "路9:9" },

            { id: 276, q: "路加福音稱伯多祿為西滿,請問還有誰也稱為西滿?", a: "熱誠者西滿、基勒乃人西滿、法利賽人西滿。" },

            { id: 277, q: "根據路加福音,如何才可以得永生?", a: "你應當全心、全靈、全力、全意愛上主,你的天主;並愛近人如你自己。" },

            { id: 278, q: "誰看到耶穌向他走來,便說「看,天主的羔羊,除免世罪者!」", a: "若翰" },

            { id: 279, q: "耶穌提到法律和先知直到「他」為止,從此天主的國的喜訊便傳揚開來,人人人都應奮勉進入,「他」是指誰?", a: "洗者若翰" },

            { id: 280, q: "路加福音中,耶穌受到魔鬼三次試探的地方,請問是哪三處?", a: "曠野、高處、聖殿頂。" },

            { id: 281, q: "耶穌山中聖訓說「四真禍與四真福」,請問四真福是指哪四福?", a: "貧窮的、飢餓的、哭泣的、為了人子的緣故惱恨並棄絕你們。" },

            { id: 282, q: "耶穌在路加福音中說了4次「你的信德救了你」,除了紀載的1.悔改的罪婦2. 治好患血漏的婦人3.治好十個癩病人中的一個撒瑪黎雅人外尚有誰?", a: "耶里哥盲者復明" },

            { id: 283, q: "「為證實你們確實是天主的子女,天主派遣了自己兒子的聖神到我們心內,使我們呼喊出什麼?」", a: "「阿爸,父啊!」" },

            { id: 284, q: "天主派遣約納往尼尼微大城去,向他們宣佈悔改的訊息,約納的第一反應是", a: "想躲開上主的面,逃到塔爾史士去。" },

            { id: 285, q: "一開頭為什麼要寫上耶穌的祖譜?", a: "證明耶穌應生於亞巴郎和達味後裔的預言" },

            { id: 286, q: "先知書中天主如何描述人們不再戰爭的新景象?", a: "民族與民族不再持刀相向,人也不再學習戰鬥。" },

            { id: 287, q: "在曷勒布山的「荊棘叢的火焰中」顯現給梅瑟。天主在那次顯現中,向梅瑟啟示了什麼樣的「名字」?", a: "我是自有者" },

            { id: 288, q: "達味明明有機會殺死撒烏耳卻沒有下手呢?", a: "對天主權威的絕對尊重(因為達味是上主的受傅者)" },

            { id: 289, q: "年輕人因為無法答覆耶穌什麼邀請,就憂悶的走了?", a: "去!變賣你所有的,施捨給窮人" },

            { id: 290, q: "見了「新天新地」和「新耶路撒冷」從天降下。根據默示錄描述,當天主與人同住時「不再有」什麼?", a: "死亡,悲傷,哀號,苦楚。" },

            { id: 291, q: "在厄弗所書勉勵信友要穿上「天主的全副武裝」,以抵禦惡魔的陰謀。請問他將和平的福音比喻為什麼裝備?", a: "走路的鞋。" },

            { id: 292, q: "在格林多前書中,保祿將「教會」比喻為什麼?", a: "一個身體。" },

            { id: 293, q: "聖名:多默的牛會卿主教,牧銘為何?正是他一生人格的寫照。他出生於河北,獲田耕莘樞機主教祝聖,在動盪的年代中流徙於南京、福寧,最終於1952年奉教宗之命來到嘉義。", a: "向窮人傳福音" },

            { id: 294, q: "教會早期的神學家稱何書為「第五部福音」?出處:聖博敏神學院", a: "依撒意亞先知書" },

            { id: 295, q: "梅瑟命令我們該如何處置犯姦淫時被捉住的婦人?", a: "用石頭" },

            { id: 296, q: "如果達味的後裔犯了罪,上主會用什麼懲戒他?", a: "用鞭、棍。" },

            { id: 297, q: "在新天新地中,幾歲死去算青年?", a: "百歲" },

            { id: 298, q: "耶穌在哪一省哪一城,行第一、第二兩個奇蹟?", a: "加里肋亞省的加納,把水變酒並治好王臣兒子的病。" },

            { id: 299, q: "耶肋米亞先知在面對謀害時,怎麼形容自己的處境?", a: "像一隻被牽去宰殺的羔羊" },

            { id: 300, q: "上主說:你們的罪雖似朱紅,將變成如何?", a: "雪一樣的潔白" },

            { id: 301, q: "是誰用雙臂接過耶穌,讚美天主說:「主啊!現在可以照你的話,讓你的僕人平安去了?」", a: "西默盎" },

            { id: 302, q: "耶穌既然親自經過試探受了苦,也必能扶助那種人?", a: "受試探的人" },

            { id: 303, q: "那位患了十二年血漏病的婦人,做了什麼舉動,竟讓她的血源立刻乾涸並獲得痊癒?", a: "摸了耶穌的衣裳" },

            { id: 304, q: "那否認聖父和聖子的,這人便是甚麼?", a: "假基督" },

            { id: 305, q: "經文提到:「『作證的有三個』,而這三者都是一致的。請問這三個分別是什麼?」", a: "聖神,水及血。" },

            { id: 306, q: "耶穌漸漸長大而強壯,充滿智慧,甚還有什麼特質常在他身上?", a: "天主的恩寵" },

            { id: 260, q: "耶穌對婦人說:「拿兒女的餅扔給小狗是不對的。」這裡的「兒女」通常是指誰?", o: ["以色列子民", "門徒們", "心地善良的人", "所有在場的人"], a: 0 },

            { id: 261, q: "天主應許賜給亞巴郎後裔作為「永久產業」的土地是哪裡?", o: ["耶路撒冷", "埃及", "客納罕", "以色列"], a: 2 },

            { id: 262, q: "耶穌顯聖容時,帶領哪三位門徒上山?", o: ["若望、雅各伯、斐理伯", "伯多祿、安德肋、雅各伯", "伯多祿、雅各伯、若望", "瑪竇、多默、猶達"], a: 2 },

            { id: 263, q: "以色列人應該在正月哪一天開始準備逾越節羔羊?", o: ["本月十五日", "本月一日", "本月十日", "本月三十日"], a: 2 },

            { id: 264, q: "下列那一項,不符合逾越節羔羊的挑選標準?", o: ["必須是一歲的公羊", "必須沒有殘疾", "只能從綿羊中挑選", "要按照家人的飯量來估計"], a: 2 },

            { id: 265, q: "天主擺在我們面前的「人生選項」是什麼?", o: ["自由與法律、順服與不順服", "生命與死亡、祝福與詛咒", "領洗與不領洗、受割禮與不受割禮", "自由與法律、領洗與不領洗"], a: 1 },

            { id: 266, q: "耶穌要求癩病人得醫治後需要去叫司祭檢驗,並奉獻梅瑟規定的祭物,其目的是什麼?", o: ["證明耶穌有醫治能力", "向司祭挑戰權威", "履行律法,並作為潔淨的證據。", "耶穌不清楚他是否真的好了?"], a: 2 },

            { id: 267, q: "撒慕爾將「背命」(不聽命)比作哪一種罪行?", o: ["偷竊", "嫉妒", "說謊", "行占卜"], a: 3 },

            { id: 268, q: "耶穌工作主要是哪三個面向?", o: ["出生、受洗、受難", "教導、宣講、醫治", "行軍、打仗、統治", "祈禱、禁食、施捨"], a: 1 },

            { id: 269, q: "一位女子把香液倒在耶穌身上,耶穌認為這是在為祂的什麼事做準備?", o: ["安葬", "講道", "治病", "慶祝逾越節晚餐"], a: 0 },

            { id: 270, q: "關於出賣人子的那個人,耶穌給出了什麼樣的感嘆或警告?", o: ["他會得到賞識", "這是必要的犧牲", "他以後會變得很窮", "那人若是沒有生,為他更好"], a: 3 },

            { id: 271, q: "撒種的比喻,落在「路旁」的種子最後怎麼了?", o: ["開出美麗的花", "被路人踩碎", "被太陽曬焦", "被飛鳥吃掉"], a: 3 },

            { id: 272, q: "達味陷害烏黎雅的故事中,是誰把那封「索命信」帶給約阿布將軍的?", o: ["敵方的間諜", "達味最信任的僕人", "巴特舍巴", "烏黎雅本人"], a: 3 },

            { id: 273, q: "吃逾越節晚餐,除了要束腰和穿鞋,手中還必須拿著什麼?", o: ["金叉子", "酒杯", "棍杖", "法律書"], a: 2 },

            { id: 274, q: "天主第一天創造的東西是什麼?", o: ["蔬菜與樹木", "光", "人類與動物", "海洋與陸地"], a: 1 },

            { id: 275, q: "耶穌是透過什麼方式「學習了服從」?", o: ["向人發號施令", "閱讀經典", "所受的苦難", "天主的直接命令"], a: 2 }

        ];



        // 應用狀態

        let state = {

            quizType: "short", // short | choice

            mode: "range",    // range | random

            currentPool: [],

            currentIndex: 0,

            wrongAnswers: [],

            isFinished: false,

            hasAnswered: false

        };



        const synth = window.speechSynthesis;



        function updateMaxRange() {

            const quizType = document.querySelector('input[name="quiz-type"]:checked').value;

            const max = quizType === 'short' ? rawShortAnswers.length : rawChoices.length;

            document.getElementById('range-end').value = Math.min(10, max);

            document.getElementById('range-end').max = max;

            document.getElementById('range-start').max = max;

        }



        function toggleMode() {

            const mode = document.querySelector('input[name="mode"]:checked').value;

            document.getElementById('random-count-box').classList.toggle('hidden', mode === 'range');

        }



        function startQuiz() {

            state.quizType = document.querySelector('input[name="quiz-type"]:checked').value;

            state.mode = document.querySelector('input[name="mode"]:checked').value;

            

            const startNum = parseInt(document.getElementById('range-start').value);

            const endNum = parseInt(document.getElementById('range-end').value);

            

            let basePool = state.quizType === 'short' ? rawShortAnswers : rawChoices;

            

            // 範圍過濾

            let filtered = basePool.filter(item => item.id >= startNum && item.id <= endNum);

            

            if (filtered.length === 0) return alert("該範圍內無題目");



            if (state.mode === 'random') {

                const count = parseInt(document.getElementById('random-count').value);

                state.currentPool = filtered.sort(() => 0.5 - Math.random()).slice(0, count);

            } else {

                state.currentPool = filtered;

            }



            state.currentIndex = 0;

            state.wrongAnswers = [];

            showStep('step-quiz');

            loadQuestion();

        }



        function loadQuestion() {

            state.hasAnswered = false;

            const item = state.currentPool[state.currentIndex];

            

            // 更新 UI 資訊

            document.getElementById('quiz-progress').innerText = `題目 ${state.currentIndex + 1} / ${state.currentPool.length}`;

            document.getElementById('quiz-id-tag').innerText = `題號 #${item.id}`;

            document.getElementById('question-text').innerText = item.q;

            

            // 重置控制項

            document.getElementById('btn-next').classList.add('hidden');

            

            if (state.quizType === 'short') {

                document.getElementById('ui-short').classList.remove('hidden');

                document.getElementById('ui-choice').classList.add('hidden');

                document.getElementById('short-answer-box').classList.add('hidden');

                document.getElementById('short-judge-group').classList.add('hidden');

                document.getElementById('btn-show-answer').classList.remove('hidden');

                document.getElementById('correct-answer-text').innerText = item.a;

            } else {

                document.getElementById('ui-short').classList.add('hidden');

                document.getElementById('ui-choice').classList.remove('hidden');

                renderChoices(item);

            }



            speak(item.q);

        }



        function speak(text) {

            synth.cancel();

            const utter = new SpeechSynthesisUtterance(text);

            utter.lang = 'zh-TW';

            utter.rate = 1.1;

            synth.speak(utter);

        }



        function renderChoices(item) {

            const container = document.getElementById('ui-choice');

            container.innerHTML = '';

            const labels = ['a', 'b', 'c', 'd'];

            item.o.forEach((opt, idx) => {

                const btn = document.createElement('button');

                btn.className = "text-left p-4 border-2 rounded-lg hover:border-blue-400 transition flex items-start gap-3 bg-white";

                btn.innerHTML = `<span class="bg-blue-100 text-blue-800 px-2 rounded font-bold">${labels[idx]}</span> <span>${opt}</span>`;

                btn.onclick = () => selectChoice(idx);

                container.appendChild(btn);

            });

        }



        function showShortAnswer() {

            document.getElementById('short-answer-box').classList.remove('hidden');

            document.getElementById('short-judge-group').classList.remove('hidden');

            document.getElementById('btn-show-answer').classList.add('hidden');

            state.hasAnswered = true;

        }



        function judgeShort(isCorrect) {

            if (!isCorrect) {

                state.wrongAnswers.push(state.currentPool[state.currentIndex]);

            }

            nextQuestion();

        }



        function selectChoice(index) {

            if (state.hasAnswered) return;

            state.hasAnswered = true;

            const item = state.currentPool[state.currentIndex];

            const buttons = document.getElementById('ui-choice').children;

            

            // 顯示正確/錯誤

            if (index === item.a) {

                buttons[index].classList.add('border-green-500', 'bg-green-50');

            } else {

                buttons[index].classList.add('border-red-500', 'bg-red-50');

                if (buttons[item.a]) {

                    buttons[item.a].classList.add('border-green-500', 'bg-green-50');

                }

                state.wrongAnswers.push(item);

            }

            

            document.getElementById('btn-next').classList.remove('hidden');

        }



        function nextQuestion() {

            state.currentIndex++;

            if (state.currentIndex < state.currentPool.length) {

                loadQuestion();

            } else {

                showResult();

            }

        }



        function showResult() {

            showStep('step-result');

            const total = state.currentPool.length;

            const wrongCount = state.wrongAnswers.length;

            const correctCount = total - wrongCount;

            document.getElementById('score-summary').innerText = `完成作答！正確：${correctCount} 題，錯誤：${wrongCount} 題`;

            

            const list = document.getElementById('wrong-list');

            list.innerHTML = '';

            

            if (state.wrongAnswers.length === 0) {

                list.innerHTML = '<p class="text-green-600 font-bold">太棒了！全部正確！</p>';

            } else {

                state.wrongAnswers.forEach(item => {

                    const div = document.createElement('div');

                    div.className = "bg-gray-50 p-4 rounded border-l-4 border-red-500";

                    const ans = state.quizType === 'short' ? item.a : `${['a','b','c','d'][item.a]}. ${item.o[item.a]}`;

                    div.innerHTML = `

                        <p class="font-bold text-gray-700">題號 ${item.id}: ${item.q}</p>

                        <p class="text-blue-700 mt-1">正確答案：${ans}</p>

                    `;

                    list.appendChild(div);

                });

            }

        }



        function showStep(stepId) {

            ['step-config', 'step-quiz', 'step-result'].forEach(id => {

                document.getElementById(id).classList.add('hidden');

            });

            document.getElementById(stepId).classList.remove('hidden');

        }



        function restartApp() {

            state.currentIndex = 0;

            state.wrongAnswers = [];

            showStep('step-config');

        }



        // 初始化

        updateMaxRange();



        // 熱鍵設定

        window.addEventListener('keydown', (e) => {

            if (document.getElementById('step-quiz').classList.contains('hidden')) return;

            if (state.quizType === 'short' && state.hasAnswered) {

                if (e.key === 'ArrowLeft') judgeShort(true);

                if (e.key === 'ArrowRight') judgeShort(false);

            }

        });

    </script>
